id = "figcraft"
version = "0.18.1"
name = "FigCraft"
description = "Open-source interface design and prototyping for ACowork"
icon = "figcraft"
builtin = false

[process]
runtime = "generic"
binary = "figcraft-acowork"
port_hint = 18090
port_file = "figcraft.port"
health_path = "/health"

[mcp]
path = "/mcp"
protocol = "streamable-http"
auto_inject = false
gateway_path = "/api/apps/figcraft/mcp"

[ui]
path = "/ui/"
mode = "webview"

[ui.nav]
label = "FigCraft"
icon = "figcraft"
order = 40

[activation]
events = ["onStartup", "onNavigate"]

[permissions]
platform = ["identity.read", "context.read"]

[package]
app_api = 1
# Filled by package.ps1 / package.sh for the target being built.
platforms = ["windows-x86_64"]
entry = "bin/figcraft-acowork.exe"
