id = "figcraft"
version = "0.18.2"
name = "FigCraft (ACowork)"
description = "ACowork hosted adaptation of FigCraft - interface design and prototyping. Based on FigCraft by the ArtCraft team; not an ArtCraft product."
icon = "figcraft"
builtin = false

[process]
runtime = "generic"
binary = "figcraft-acowork"
port_hint = 18090
port_file = "figcraft.port"
health_path = "/health"

[mcp]
path = "/mcp"
protocol = "streamable-http"
auto_inject = true
gateway_path = "/api/apps/figcraft/mcp"

[ui]
path = "/ui/"
mode = "webview"

[ui.canvas]
kind = "visual"
preview_path = "/?file={workspace_file}"

[ui.nav]
label = "FigCraft (ACowork)"
icon = "figcraft"
order = 40

[activation]
events = ["onStartup", "onNavigate"]

[permissions]
platform = ["identity.read", "context.read"]

[package]
app_api = 1
# Filled by package.ps1 / package.sh for the target being built.
platforms = ["windows-x86_64"]
entry = "bin/figcraft-acowork.exe"
